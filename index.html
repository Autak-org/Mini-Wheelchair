<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Stair Climbing Wheelchair</title>
<style>
:root{
  color-scheme:light;
  --white:#ffffff; --bg:#ffffff; --tint:#fdf0f5; --line:#f3c9db;
  --text:#3a0d24; --muted:#8a5a72;
  --pink:#c2185b; --pink-dark:#880e4f; --pink-mid:#e0306f; --pink-light:#f48fb1;
  --green:#12905a; --amber:#d17a00; --red:#d32f2f;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  display:flex;flex-direction:column;
  height:100dvh;overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* ---------- top bar: solid deep pink ---------- */
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--pink);color:#fff}
#logo{height:38px;width:auto;flex:none;display:block}
header h1{font-size:18px;font-weight:800;letter-spacing:.3px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
#dot{width:12px;height:12px;border-radius:50%;background:var(--pink-light);border:2px solid #fff}
#dot.on{background:#3ddc84} #dot.err{background:#ff5252}
button{
  font:inherit;font-size:18px;font-weight:700;border:0;border-radius:14px;
  min-height:52px;padding:12px 22px;cursor:pointer;
  background:var(--pink);color:#fff;box-shadow:0 4px 0 var(--pink-dark);
}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pink-dark)}
button:focus-visible{outline:3px solid var(--text);outline-offset:2px}
header button{background:#fff;color:var(--pink);box-shadow:0 4px 0 var(--pink-dark)}

/* ---------- main: controller left, info right ---------- */
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px}

.left{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;gap:10px}
#pad{
  height:100%;max-width:100%;aspect-ratio:1;max-height:100%;
  border-radius:50%;position:relative;touch-action:none;
  background:var(--tint);border:6px solid var(--pink);
}
#pad::before,#pad::after{content:"";position:absolute;background:var(--line);border-radius:2px}
#pad::before{left:50%;top:10%;bottom:10%;width:3px;margin-left:-1.5px}
#pad::after{top:50%;left:10%;right:10%;height:3px;margin-top:-1.5px}
.ring{position:absolute;inset:22%;border-radius:50%;border:3px solid var(--line);pointer-events:none}
#knob{
  width:36%;height:36%;border-radius:50%;position:absolute;left:32%;top:32%;z-index:1;
  background:var(--pink);border:5px solid #fff;
  box-shadow:0 0 0 3px var(--pink),0 8px 16px rgba(136,14,79,.4);
}
.hint{font-size:13px;color:var(--muted);margin:0;text-align:center}

.right{display:flex;flex-direction:column;gap:12px;min-height:0}
.card{background:var(--white);border:2px solid var(--line);border-radius:20px;padding:14px}
.card small{display:block;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}

/* seat angle */
.seat{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-color:var(--pink)}
#gauge{flex:1 1 0;min-height:0;width:100%;max-width:380px}
#tilt{transform-origin:100px 118px;transition:transform .1s linear}
#angle{font-size:36px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--muted)}
#angle.ok{color:var(--green)} #angle.warn{color:var(--amber)} #angle.bad{color:var(--red)}
#dir{font-size:14px;color:var(--muted)}

/* mode card: solid deep pink block */
.mode{display:flex;align-items:center;gap:12px;background:var(--pink);border-color:var(--pink);color:#fff}
.mode small{color:#fbd0e1}
.mode > div:first-child{min-width:78px}
#mode{font-size:24px;font-weight:800;color:#fff}
.mode .btns{display:flex;gap:10px;flex:1}
.mode .btns button{
  flex:1;min-height:58px;font-size:16px;padding:10px 8px;
  background:#fff;color:var(--pink);box-shadow:0 4px 0 var(--pink-dark);
}

/* ---------- portrait phone: stack and ask to rotate ---------- */
@media (orientation:portrait){
  body{overflow:auto;height:auto;min-height:100dvh}
  main{grid-template-columns:1fr}
  #pad{width:min(80vw,320px);height:auto}
  .seat{min-height:190px}
  .mode{flex-wrap:wrap}
  .rotate{display:block}
}
.rotate{display:none;text-align:center;font-size:13px;font-weight:600;color:var(--pink);background:var(--tint);padding:8px 16px}
@media (prefers-reduced-motion:reduce){#tilt{transition:none}button:active{transform:none}}
</style>
</head>

<main>
  <!-- LEFT: joystick -->
  <section class="left">
    <div id="pad"><div class="ring"></div><div id="knob"></div></div>
    <p class="hint">Push the joystick to move. Release to stop.</p>
  </section>

  <!-- RIGHT: seat angle + mode -->
  <section class="right">
    <div class="card seat">
      <small>Seat angle (front / back)</small>
      <svg id="gauge" viewBox="14 26 172 112" role="img" aria-label="Seat angle, side view">
        <!-- level reference -->
        <line x1="20" y1="118" x2="180" y2="118" stroke="#f48fb1" stroke-width="2" stroke-dasharray="5 5"/>
        <!-- seat, side view. Front of the chair is on the right. -->
        <g id="tilt">
          <rect x="62" y="108" width="76" height="10" rx="4" fill="#c2185b"/>      <!-- cushion -->
          <rect x="62" y="40" width="10" height="72" rx="4" fill="#c2185b"/>       <!-- backrest -->
          <rect x="130" y="112" width="26" height="6" rx="3" fill="#f48fb1"/>      <!-- front edge marker -->
        </g>
        <circle cx="100" cy="118" r="4" fill="#3a0d24"/>
        <text x="22" y="134" fill="#8a5a72" font-size="11">Back</text>
        <text x="178" y="134" fill="#8a5a72" font-size="11" text-anchor="end">Front</text>
      </svg>
      <div id="angle">--°</div>
      <div id="dir">Waiting for sensor</div>
    </div>

    <div class="card mode">
      <div><small>Mode</small><div id="mode">Drive</div></div>
      <div class="btns">
        <button id="z">Set level</button>
        <button id="b">Switch mode</button>
      </div>
    </div>
  </section>
</main>

<script>
const SERVICE='6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const RX='6e400002-b5a3-f393-e0a9-e50e24dcca9e';
const TX='6e400003-b5a3-f393-e0a9-e50e24dcca9e';
const enc=new TextEncoder(),dec=new TextDecoder();
const $=id=>document.getElementById(id);
const st=$('st'),dot=$('dot'),modeEl=$('mode');
const tilt=$('tilt'),angleEl=$('angle'),dirEl=$('dir');
let rx=null,busy=false;

function setStatus(text,state){st.textContent=text;dot.className=state||'';}

// angle > 0 = seat tilted back, angle < 0 = tilted forward
function showSeat(a){
  const mag=Math.abs(a);
  tilt.style.transform='rotate('+(-a)+'deg)';   // tilted back lifts the front edge
  angleEl.textContent=mag.toFixed(1)+'°';
  angleEl.className=mag<=2?'ok':(mag<=8?'warn':'bad');
  dirEl.textContent=mag<1?'Level':(a>0?'Tilted back':'Tilted forward');
}

async function connect(){
 try{
  if(!navigator.bluetooth)throw new Error('Bluetooth is not supported in this browser (use Chrome on Android)');
  const dev=await navigator.bluetooth.requestDevice({filters:[{services:[SERVICE]}]});
  dev.addEventListener('gattserverdisconnected',()=>{rx=null;setStatus('Disconnected','err');$('conn').textContent='Reconnect';});
  setStatus('Connecting…');
  const server=await dev.gatt.connect(),svc=await server.getPrimaryService(SERVICE);
  rx=await svc.getCharacteristic(RX);const tx=await svc.getCharacteristic(TX);
  await tx.startNotifications();
  tx.addEventListener('characteristicvaluechanged',e=>{
   const msg=dec.decode(e.target.value).trim();
   if(msg.startsWith('SEAT,')){
    const a=Number(msg.split(',')[1]);
    if(Number.isFinite(a))showSeat(a);
   }else if(msg==='DRIVE'||msg==='CLIMB'){
    modeEl.textContent=msg==='CLIMB'?'Climb':'Drive';
   }
  });
  setStatus('Connected','on');$('conn').textContent='Connected';
  keepAwake();
 }catch(err){
  if(err.name==='NotFoundError')setStatus('No device selected');
  else setStatus('Connection failed: '+err.message,'err');
 }
}

// keep the screen on while driving (ignored if unsupported)
async function keepAwake(){try{if(navigator.wakeLock)await navigator.wakeLock.request('screen');}catch(e){}}

async function send(text){if(!rx||busy)return;busy=true;try{await rx.writeValueWithoutResponse(enc.encode(text));}catch(e){}busy=false;}
$('conn').onclick=connect;
$('b').onclick=()=>send('M\n');
$('z').onclick=()=>{
  if(confirm('Is the chassis on level ground and the seat level right now? This saves the current position as 0°.'))send('Z\n');
};

/* ---------- joystick ---------- */
const pad=$('pad'),knob=$('knob');
let x=0,y=0,active=false;
function move(e){
 const r=pad.getBoundingClientRect(),R=r.width/2,k=knob.offsetWidth/2;
 let dx=(e.clientX-(r.left+R))/R,dy=(e.clientY-(r.top+R))/R;
 const d=Math.hypot(dx,dy);if(d>1){dx/=d;dy/=d;}
 x=dx;y=-dy;
 knob.style.left=(R+dx*(R-k)-k)+'px';knob.style.top=(R+dy*(R-k)-k)+'px';
}
function resetKnob(){knob.style.left='32%';knob.style.top='32%';}
pad.addEventListener('pointerdown',e=>{active=true;pad.setPointerCapture(e.pointerId);move(e);});
pad.addEventListener('pointermove',e=>{if(active)move(e);});
function release(){active=false;x=0;y=0;resetKnob();busy=false;send('J,0.00,0.00\n');}
pad.addEventListener('pointerup',release);
pad.addEventListener('pointercancel',release);
setInterval(()=>{if(active)send('J,'+x.toFixed(2)+','+y.toFixed(2)+'\n');},60);

// safety: if the page is hidden while holding the joystick, stop
document.addEventListener('visibilitychange',()=>{if(document.hidden&&active)release();});
</script>
</body>
</html>
